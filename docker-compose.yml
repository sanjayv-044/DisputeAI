services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disputeai-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/disputes.db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disputeai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped